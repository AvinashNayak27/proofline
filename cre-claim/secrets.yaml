secretsNames:
  # X25519 private key (0x + 64 hex) that opens the creator's encrypted X session request inside the enclave.
  # The value lives only in your environment / the CRE Vault, never in this file.
  ENCLAVE_PRIVATE_KEY:
    - ENCLAVE_PRIVATE_KEY
  # secp256k1 private key (0x + 64 hex) that signs every reward report. Its address is registered on the
  # ProoflineCampaigns contract with setReportSigner. Same rule: never in this file.
  REPORT_SIGNER_PRIVATE_KEY:
    - REPORT_SIGNER_PRIVATE_KEY
