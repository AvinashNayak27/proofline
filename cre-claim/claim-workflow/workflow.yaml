# Receiver-free local simulation. Never deploy, activate, or broadcast this target.
local-simulation:
  user-workflow:
    workflow-name: "claim-workflow-local-simulation"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.local-simulation.json"
    secrets-path: ""

# Arc Testnet target for broadcast simulation and (after Early Access) deployment.
# Fails closed until config.staging.json has a real receiver and authorizedKeys.
staging-settings:
  user-workflow:
    workflow-name: "claim-workflow-staging"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: ""
