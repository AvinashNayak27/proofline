specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ProoflineCampaigns
    network: arc-testnet
    source:
      address: "0x433920fdc403317005eb8c5dcf9a43a153243528"
      abi: ProoflineCampaigns
      startBlock: 71078006
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Campaign
        - Reward
        - Wallet
        - Creator
      abis:
        - name: ProoflineCampaigns
          file: ./abis/ProoflineCampaigns.json
      eventHandlers:
        - event: CampaignCreated(indexed uint256,indexed address,(string,string,string,string,string,uint64,uint64,uint32,uint16,uint96,uint96,uint96,bool,uint256))
          handler: handleCampaignCreated
        - event: PostRewarded(indexed uint256,indexed bytes32,indexed bytes32,address,uint256,uint256,uint256)
          handler: handlePostRewarded
      file: ./src/mapping.ts
